apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: queues.rabbitmq.bruno.io
spec:
  group: rabbitmq.bruno.io
  names:
    plural: queues
    singular: queue
    kind: Queue
    shortNames:
      - rq
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                durable:
                  type: boolean
                autoDelete:
                  type: boolean
                arguments:
                  type: object
# description: Argumentos opcionais para configuração avançada da fila (ex: x-message-ttl).
                  additionalProperties: true
                connection:
                  type: object
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
              required:
                - name
      subresources:
        status: {}
