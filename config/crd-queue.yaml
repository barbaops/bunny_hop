apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: queues.rabbitmq.bruno.io
spec:
  group: rabbitmq.bruno.io
  names:
    plural: queues
    singular: queue
    kind: Queue
    shortNames:
      - rq
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^qu.[a-zA-Z0-9_.-]+$'  # Queue name init with qu
                durable:
                  type: boolean
                  default: true
                autoDelete:
                  type: boolean
                  default: false
                arguments:
                  type: object
                  additionalProperties:
                    type: string
                x-message-ttl:
                  type: integer
                  minimum: 1000        # mínimo 1s
                  maximum: 604800000   # máximo 7 dias em ms
