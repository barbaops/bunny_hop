# config/crd-binding.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bindings.rabbitmq.bruno.io
spec:
  group: rabbitmq.bruno.io
  names:
    plural: bindings
    singular: binding
    kind: Binding
    shortNames:
      - rb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                exchange:
                  type: string
                queue:
                  type: string
                routingKey:
                  type: string
              required: ["exchange", "queue", "routingKey"]

