apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shovels.rabbitmq.bruno.io
spec:
  group: rabbitmq.bruno.io
  names:
    plural: shovels
    singular: shovel
    kind: Shovel
    shortNames:
      - rsh
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sourceURI:
                  type: string
                sourceQueue:
                  type: string
                sourceExchange:
                  type: string
                destinationURI:
                  type: string
                destinationQueue:
                  type: string
                destinationExchange:
                  type: string
                routingKey:
                  type: string
                reconnectDelay:
                  type: integer
              anyOf:
                - required: ["sourceQueue"]
                - required: ["sourceExchange"]
              anyOf:
                - required: ["destinationQueue"]
                - required: ["destinationExchange"]
